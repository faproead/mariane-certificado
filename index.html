<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha - Mariane Fernandes da Silva</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Montserrat', sans-serif;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  .card {
    width: 100%;
    max-width: 860px;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    background: radial-gradient(circle at 57% 59%,
        #1d5c80   0px,
        #1c5c84  30px,
        #1c5c83  60px,
        #1d5b82  90px,
        #1d5980 105px,
        #1d587e 120px,
        #1d567d 135px,
        #1d547a 150px,
        #1d5177 165px,
        #1c4d73 180px,
        #1c4a70 195px,
        #1c476d 210px,
        #1c4469 225px,
        #1c4268 270px,
        #1b3f66 285px,
        #1b3d64 300px,
        #1b3c63 315px,
        #1b3a61 330px,
        #1b3860 345px,
        #1b375f 390px,
        #1b365e 435px,
        #1b345c 510px
    );
  }

  /* === DESKTOP === */
  .left {
    width: 310px;
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
    flex-shrink: 0;
  }

  .field-group { display: flex; flex-direction: column; gap: 1px; }

  .lbl {
    font-size: 9.5px;
    font-weight: 700;
    color: #8dc63f;
    letter-spacing: 0.3px;
  }

  .val {
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
  }

  .val-sm { font-size: 12px; }

  .divider {
    width: 1px;
    background: rgba(255,255,255,0.22);
    margin: 18px 0;
    flex-shrink: 0;
    z-index: 1;
  }

  .middle {
    width: 130px;
    padding: 16px 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
    flex-shrink: 0;
  }

  .photo {
    width: 88px;
    height: 108px;
    border-radius: 9px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.25);
  }

  .lbl-center {
    font-size: 8.5px;
    font-weight: 700;
    color: #8dc63f;
    text-align: center;
    margin-top: 7px;
    letter-spacing: 0.2px;
  }

  .val-center {
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    text-align: center;
    margin-top: 1px;
  }

  .right {
    flex: 1;
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .course-block { display: flex; flex-direction: column; gap: 2px; }

  .course-name {
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    line-height: 1.35;
    margin-top: 2px;
  }

  .row { display: flex; gap: 36px; margin-top: 4px; }

  .tv-val {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-top: 1px;
  }

  .logos-section { display: none; }

  /* === MOBILE === */
  @media (max-width: 600px) {
    body {
      padding: 12px;
      background: #d0d0d0;
      align-items: flex-start;
      padding-top: 24px;
    }

    .card {
      flex-direction: column;
      height: auto;
      border-radius: 12px;
      background: radial-gradient(circle at 50% 30%,
        #1d5c80 0px, #1c5a7e 60px, #1b4f75 140px,
        #1b3f66 260px, #1a3560 400px, #192c58 600px
      );
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 0 16px;
      width: calc(100% - 32px);
      align-self: center;
    }

    /* TOP: logo + foto lado a lado */
    .left {
      width: 100%;
      padding: 16px 16px 12px;
      flex-direction: column;
      gap: 10px;
    }

    .left img[style*="width:170px"] {
      width: 130px !important;
      margin-bottom: 0 !important;
    }

    /* Foto no topo direito */
    .middle {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      padding: 0 16px 14px;
      gap: 14px;
      align-items: flex-start;
    }

    .photo {
      width: 80px;
      height: 98px;
      flex-shrink: 0;
    }

    .middle-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .lbl-center {
      text-align: left;
      font-size: 9px;
      margin-top: 0;
    }

    .val-center {
      text-align: left;
      font-size: 12px;
    }

    .right {
      padding: 14px 16px 18px;
    }

    .course-name {
      font-size: 13px;
    }

    .row {
      gap: 24px;
    }

    .tv-val {
      font-size: 13px;
    }
  }
</style>
</head>
